name: npm package compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: npm-package-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: npm package compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check worker availability
        id: worker
        env:
          GH_TOKEN: ${{ github.token }}
          # Pull requests run against the head branch; github.ref is a
          # synthetic merge ref and cannot be used for workflow dispatch.
          WORKER_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/npm-package-worker.yaml?ref=$WORKER_REF" >/dev/null; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run fallback suite with Porffor
        if: steps.worker.outputs.available != 'true'
        env:
          NPM_PACKAGE_CONCURRENCY: '10'
          NPM_PACKAGE_REPORT_DIR: ${{ runner.temp }}/npm-package-reports
        run: node test/npm-packages.mjs
      - name: Dispatch package workers
        if: steps.worker.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_PACKAGE_BATCH: ${{ github.run_id }}-${{ github.run_attempt }}
          NPM_PACKAGE_CONCURRENCY: '10'
          NPM_PACKAGE_REPORT_DIR: ${{ runner.temp }}/npm-package-reports
          NPM_PACKAGE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NPM_PACKAGE_WORKER_REF: ${{ github.head_ref || github.ref_name }}
        run: node test/npm-package-dispatch.mjs
      - name: Upload package logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-compatibility-logs
          path: ${{ runner.temp }}/npm-package-reports
          if-no-files-found: error
          retention-days: 14
