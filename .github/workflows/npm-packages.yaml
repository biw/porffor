name: npm package compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: npm-package-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: npm package compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run 50 packages with Porffor
        env:
          NPM_PACKAGE_CONCURRENCY: '10'
          NPM_PACKAGE_REPORT_DIR: ${{ runner.temp }}/npm-package-reports
        run: node test/npm-packages.mjs
      - name: Upload package logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-compatibility-logs
          path: ${{ runner.temp }}/npm-package-reports
          if-no-files-found: error
          retention-days: 14
